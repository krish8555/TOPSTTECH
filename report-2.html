<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Report - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="content-header">
                <h1>Detailed Report</h1>
                <button class="btn-add"><i class="fas fa-print"></i> Print Report</button>
            </div>

            <div class="content-body">
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-file-alt stat-icon"></i>
                        <div class="stat-info">
                            <h3>Total Applications</h3>
                            <p class="stat-value">1,247</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-check-circle stat-icon success"></i>
                        <div class="stat-info">
                            <h3>Approved</h3>
                            <p class="stat-value">1,172</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-dollar-sign stat-icon success"></i>
                        <div class="stat-info">
                            <h3>Total Amount</h3>
                            <p class="stat-value">$2.4M</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-percentage stat-icon"></i>
                        <div class="stat-info">
                            <h3>Success Rate</h3>
                            <p class="stat-value">94%</p>
                        </div>
                    </div>
                </div>

                <div class="table-card">
                    <h3>Report Data</h3>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Count</th>
                                    <th>Amount</th>
                                    <th>Percentage</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Disability Tax Credit</td>
                                    <td>856</td>
                                    <td>$1,850,000</td>
                                    <td>77%</td>
                                </tr>
                                <tr>
                                    <td>Medical Expenses</td>
                                    <td>316</td>
                                    <td>$550,000</td>
                                    <td>23%</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
