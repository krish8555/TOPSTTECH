<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ourcba DTC - Disability Tax Credit Application</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Landing Page -->
    <div class="landing-container">
        <div class="landing-content">
            <h1 class="main-title">Ourcba DTC</h1>
            <p class="subtitle">Disability Tax Credit Application System</p>
            <p class="description">Navigate to different sections of the application</p>
            
            <div class="page-links">
                <a href="login.html" class="page-card">
                    <i class="fas fa-sign-in-alt"></i>
                    <h3>Login</h3>
                    <p>Sign in to your account</p>
                </a>
                
                <a href="welcome.html" class="page-card">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>Welcome Form</h3>
                    <p>Start your refund application</p>
                </a>
                
                <a href="admin.html" class="page-card">
                    <i class="fas fa-user-shield"></i>
                    <h3>Admin Dashboard</h3>
                    <p>Manage applications and users</p>
                </a>
            </div>
        </div>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
        <span class="chat-text">Live Chat</span>
    </div>
</body>
</html>
