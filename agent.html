<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard - Ourcba DTC</title>
    <link rel="stylesheet" href="agent.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <select class="search-filter">
                <option value="name">Name</option>
                <option value="email">Email</option>
                <option value="id">ID</option>
            </select>
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <div class="nav-item">
                    <i class="fas fa-comments"></i>
                    <span class="nav-label">Messages</span>
                </div>
                <div class="nav-item">
                    <i class="fas fa-phone"></i>
                    <span class="nav-label">Calls</span>
                </div>
                <div class="nav-item">
                    <i class="fas fa-file-alt"></i>
                    <span class="nav-label">Documents</span>
                </div>
                <div class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </div>
                <div class="nav-item active">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agent</span>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="content-header">
                <h1>Agent Dashboard</h1>
                <button class="add-btn"><i class="fas fa-plus"></i> Add New Agent</button>
            </div>

            <!-- Agent List -->
            <div class="agent-grid">
                <div class="agent-card">
                    <div class="agent-avatar">
                        <img src="https://ui-avatars.com/api/?name=John+Doe&background=1E88E5&color=fff&size=80" alt="Agent">
                    </div>
                    <h3>John Doe</h3>
                    <p class="agent-role">Senior Agent</p>
                    <div class="agent-stats">
                        <div class="stat">
                            <span class="stat-label">Cases</span>
                            <span class="stat-value">45</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Rating</span>
                            <span class="stat-value">4.8</span>
                        </div>
                    </div>
                    <button class="view-btn">View Profile</button>
                </div>

                <div class="agent-card">
                    <div class="agent-avatar">
                        <img src="https://ui-avatars.com/api/?name=Jane+Smith&background=4CAF50&color=fff&size=80" alt="Agent">
                    </div>
                    <h3>Jane Smith</h3>
                    <p class="agent-role">Agent</p>
                    <div class="agent-stats">
                        <div class="stat">
                            <span class="stat-label">Cases</span>
                            <span class="stat-value">32</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Rating</span>
                            <span class="stat-value">4.9</span>
                        </div>
                    </div>
                    <button class="view-btn">View Profile</button>
                </div>

                <div class="agent-card">
                    <div class="agent-avatar">
                        <img src="https://ui-avatars.com/api/?name=Mike+Johnson&background=FF9800&color=fff&size=80" alt="Agent">
                    </div>
                    <h3>Mike Johnson</h3>
                    <p class="agent-role">Agent</p>
                    <div class="agent-stats">
                        <div class="stat">
                            <span class="stat-label">Cases</span>
                            <span class="stat-value">28</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Rating</span>
                            <span class="stat-value">4.7</span>
                        </div>
                    </div>
                    <button class="view-btn">View Profile</button>
                </div>

                <div class="agent-card">
                    <div class="agent-avatar">
                        <img src="https://ui-avatars.com/api/?name=Sarah+Williams&background=E91E63&color=fff&size=80" alt="Agent">
                    </div>
                    <h3>Sarah Williams</h3>
                    <p class="agent-role">Senior Agent</p>
                    <div class="agent-stats">
                        <div class="stat">
                            <span class="stat-label">Cases</span>
                            <span class="stat-value">51</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Rating</span>
                            <span class="stat-value">5.0</span>
                        </div>
                    </div>
                    <button class="view-btn">View Profile</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
