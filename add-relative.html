<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Relative - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="disability-form-container">
                <div class="form-card" style="max-width: 800px;">
                    <h1 class="form-title">Add A Family Member</h1>
                    <p class="form-description">Boost your refund by adding family members you've helped or who've helped you. This way, our team can see the full picture of your financial support and get you the biggest refund possible!</p>

                    <form class="disability-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="first-name">First Name*</label>
                                <input type="text" id="first-name" name="first-name" placeholder="Your First Name" required>
                            </div>
                            <div class="form-group">
                                <label for="last-name">Last Name*</label>
                                <input type="text" id="last-name" name="last-name" placeholder="Your Last Name" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address*</label>
                            <input type="email" id="email" name="email" placeholder="yourname@website.com" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="phone">Phone Number*</label>
                                <div class="phone-input-group">
                                    <select class="country-code">
                                        <option value="+91" selected>+91</option>
                                        <option value="+1">+1</option>
                                        <option value="+44">+44</option>
                                    </select>
                                    <input type="tel" id="phone" name="phone" placeholder="XXX - XXX - XXXX" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="dob">DOB</label>
                                <input type="date" id="dob" name="dob" placeholder="Select Your DOB">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="relationship">Relationship</label>
                            <select id="relationship" name="relationship">
                                <option value="">Select relationship</option>
                                <option value="father" selected>Father</option>
                                <option value="mother">Mother</option>
                                <option value="spouse">Spouse</option>
                                <option value="child">Child</option>
                                <option value="sibling">Sibling</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="disabilities">Do They Have Any Disabilities?</label>
                            <select id="disabilities" name="disabilities">
                                <option value="">Please select</option>
                                <option value="no" selected>No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="living-together">Do you currently live with them, or have you lived with them in the past?</label>
                            <select id="living-together" name="living-together">
                                <option value="">Please select</option>
                                <option value="no" selected>No</option>
                                <option value="yes-currently">Yes, currently</option>
                                <option value="yes-past">Yes, in the past</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="support-provided">Have they provided support to you in the past 10 years?</label>
                            <select id="support-provided" name="support-provided">
                                <option value="">Please select</option>
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-next">Add Family Member</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
