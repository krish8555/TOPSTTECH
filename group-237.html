<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 237 - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="content-header">
                <h1>Group Management - 237</h1>
                <button class="btn-add"><i class="fas fa-users"></i> Add Members</button>
            </div>

            <div class="content-body">
                <div class="table-card">
                    <h3>Group Members</h3>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Member ID</th>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th>Join Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>#M-001</td>
                                    <td>John Doe</td>
                                    <td>Administrator</td>
                                    <td>Jan 1, 2024</td>
                                    <td><span class="status-badge completed">Active</span></td>
                                    <td><button class="btn-view">Edit</button></td>
                                </tr>
                                <tr>
                                    <td>#M-002</td>
                                    <td>Jane Smith</td>
                                    <td>Member</td>
                                    <td>Jan 5, 2024</td>
                                    <td><span class="status-badge completed">Active</span></td>
                                    <td><button class="btn-view">Edit</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
