<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDI Add Popup - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="disability-form-container">
                <div class="form-card" style="max-width: 600px;">
                    <h1 class="form-title">Add DDI Information</h1>
                    <p class="form-description">Enter Direct Deposit Information for client payments</p>

                    <form class="disability-form">
                        <div class="form-group">
                            <label for="account-holder">Account Holder Name*</label>
                            <input type="text" id="account-holder" name="account-holder" placeholder="Enter account holder name" required>
                        </div>

                        <div class="form-group">
                            <label for="bank-name">Bank Name*</label>
                            <input type="text" id="bank-name" name="bank-name" placeholder="Enter bank name" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="transit">Transit Number*</label>
                                <input type="text" id="transit" name="transit" placeholder="XXXXX" maxlength="5" required>
                            </div>
                            <div class="form-group">
                                <label for="institution">Institution Number*</label>
                                <input type="text" id="institution" name="institution" placeholder="XXX" maxlength="3" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="account-number">Account Number*</label>
                            <input type="text" id="account-number" name="account-number" placeholder="Enter account number" required>
                        </div>

                        <div class="form-row">
                            <button type="button" class="btn-secondary">Cancel</button>
                            <button type="submit" class="btn-next">Save DDI</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
