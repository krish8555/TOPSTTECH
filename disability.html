<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disability Information - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="disability-form-container">
                <div class="form-card">
                    <h1 class="form-title">Effects of Your Medical Conditions</h1>
                    <p class="form-subtitle">Help us understand your unique situation to maximize your benefits!</p>
                    <p class="form-description">Tell us about your medical conditions and how they have impacted your daily life.</p>

                    <form class="disability-form">
                        <div class="form-group">
                            <label for="restricted-areas">What areas are you restricted due to your medical condition(s)?</label>
                            <select id="restricted-areas" name="restricted-areas" required>
                                <option value="">Select an option</option>
                                <option value="vision" selected>Vision</option>
                                <option value="hearing">Hearing</option>
                                <option value="walking">Walking</option>
                                <option value="speaking">Speaking</option>
                                <option value="mental-functions">Mental Functions</option>
                                <option value="feeding">Feeding</option>
                                <option value="dressing">Dressing</option>
                                <option value="elimination">Elimination (bowel or bladder functions)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="life-sustaining">Do you require life sustaining therapy to support a vital function?</label>
                            <select id="life-sustaining" name="life-sustaining" required>
                                <option value="">Select an option</option>
                                <option value="yes" selected>Yes</option>
                                <option value="no">No</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-next">Next</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
