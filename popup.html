<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Dialog - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="disability-form-container">
                <div class="form-card" style="max-width: 500px;">
                    <h1 class="form-title">Confirmation</h1>
                    <p class="form-description">Please confirm your action</p>

                    <div class="popup-content">
                        <i class="fas fa-info-circle" style="font-size: 48px; color: var(--primary-color); margin-bottom: 20px;"></i>
                        <p style="text-align: center; color: var(--text-dark); margin-bottom: 30px;">Are you sure you want to proceed with this action? This cannot be undone.</p>

                        <div class="form-row">
                            <button type="button" class="btn-secondary">Cancel</button>
                            <button type="button" class="btn-next">Confirm</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
