<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disability Details - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="disability-form-container">
                <div class="form-card">
                    <form class="disability-form">
                        <div class="form-group">
                            <label for="ability-to-see">What best describes your ability to see?</label>
                            <select id="ability-to-see" name="ability-to-see" required>
                                <option value="">Select an option</option>
                                <option value="legally-blind" selected>Is legally blind in both eyes, even when using application corrective devices or therapy</option>
                                <option value="severe-restriction">Has severe restriction in seeing, even with corrective lenses</option>
                                <option value="moderate-restriction">Has moderate restriction in seeing</option>
                                <option value="no-restriction">Has no significant restriction</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="limiting-factors">What factors limit your ability to see?</label>
                            <div class="multi-select-wrapper">
                                <select id="limiting-factors" name="limiting-factors" multiple class="multi-select-dropdown">
                                    <option value="blurred-vision" selected>Blurred Vision</option>
                                    <option value="peripheral-vision">Peripheral vision problem</option>
                                    <option value="cataracts">Cataracts</option>
                                    <option value="double-vision">Double vision</option>
                                    <option value="glaucoma">Glaucoma</option>
                                    <option value="macular-degeneration">Macular degeneration</option>
                                    <option value="diabetic-retinopathy">Diabetic retinopathy</option>
                                    <option value="other">Other</option>
                                </select>
                                <div class="selected-tags">
                                    <span class="tag">Blurred Vision <i class="fas fa-times"></i></span>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn-next">Save</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
