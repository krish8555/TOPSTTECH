<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Reassessment - Ourcba DTC</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="logo">
            <div class="logo-circle">HM</div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search">
            <button class="search-btn">Search</button>
        </div>

        <div class="user-info">
            <span class="greeting">Hi, <strong>Karan</strong></span>
            <img src="https://ui-avatars.com/api/?name=Karan&background=1E88E5&color=fff&size=40" alt="User Avatar" class="user-avatar">
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Home</span>
                </a>
                <a href="all-pages.html" class="nav-item">
                    <i class="fas fa-th"></i>
                    <span class="nav-label">All Pages</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-user-shield"></i>
                    <span class="nav-label">Admin</span>
                </a>
                <a href="agent.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-label">Agents</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="disability-form-container">
                <div class="form-card" style="max-width: 800px;">
                    <h1 class="form-title">Add New Reassessment Request</h1>
                    <p class="form-description">Submit a new reassessment request for disability tax credit review.</p>

                    <form class="disability-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="client-name-ra">Client Name*</label>
                                <input type="text" id="client-name-ra" name="client-name" placeholder="Enter client name" required>
                            </div>
                            <div class="form-group">
                                <label for="client-sin">SIN*</label>
                                <input type="text" id="client-sin" name="client-sin" placeholder="XXX-XXX-XXX" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="reassessment-type">Reassessment Type*</label>
                                <select id="reassessment-type" name="reassessment-type" required>
                                    <option value="">Select type</option>
                                    <option value="dtc">DTC Reassessment</option>
                                    <option value="medical">Medical Review</option>
                                    <option value="income">Income Review</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="tax-year">Tax Year*</label>
                                <select id="tax-year" name="tax-year" required>
                                    <option value="">Select year</option>
                                    <option value="2023">2023</option>
                                    <option value="2022">2022</option>
                                    <option value="2021">2021</option>
                                    <option value="2020">2020</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="reason">Reason for Reassessment*</label>
                            <textarea id="reason" name="reason" rows="4" placeholder="Provide detailed reason for the reassessment request" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="supporting-docs">Supporting Documents</label>
                            <input type="file" id="supporting-docs" name="supporting-docs" multiple>
                            <p class="form-hint">Upload any supporting medical or financial documents (PDF, JPG, PNG)</p>
                        </div>

                        <div class="form-row">
                            <button type="button" class="btn-secondary">Cancel</button>
                            <button type="submit" class="btn-next">Submit Request</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Live Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>
</body>
</html>
